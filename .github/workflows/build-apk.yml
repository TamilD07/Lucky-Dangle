name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Gradle Wrapper
        working-directory: ./android
        shell: bash
        run: |
          set -euo pipefail

          # 1. Ensure gradlew is the complete, official Gradle wrapper script with APP_HOME resolution
          if [ ! -f "gradlew" ] || ! grep -q "APP_HOME=" gradlew; then
            echo "gradlew is missing or incomplete; downloading official Gradle wrapper script..."
            curl --fail --silent --show-error --location \
              --retry 3 \
              --output gradlew \
              "https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradlew"
          fi
          chmod +x ./gradlew

          # 2. Ensure gradle-wrapper.jar exists and contains org/gradle/wrapper/GradleWrapperMain.class
          wrapper_jar="gradle/wrapper/gradle-wrapper.jar"
          expected_class="org/gradle/wrapper/GradleWrapperMain.class"

          mkdir -p gradle/wrapper

          if [ ! -f "$wrapper_jar" ] || \
             ! unzip -l "$wrapper_jar" 2>/dev/null | grep -q "$expected_class"; then
            echo "Invalid or missing Gradle wrapper JAR; downloading a valid copy..."

            curl --fail --silent --show-error --location \
              --retry 3 \
              --output "$wrapper_jar" \
              "https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar"
          fi

          unzip -l "$wrapper_jar" | grep "$expected_class"
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyDangle-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
